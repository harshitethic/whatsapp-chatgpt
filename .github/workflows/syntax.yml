name: JavaScript syntax and config checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check index.js
      - run: node --check sansekai.js
      - run: node --check config.js
      - run: node --check privacy.js
      - run: node --test tests/*.test.js
